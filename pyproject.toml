[project]
name = "pytest_kustomize"
description = "Parse and validate kustomize output"

dependencies = [
    "pyyaml",
]

authors = [{name="DIE ZEIT", email="engineering@zeit.de"}]
license = {text="BSD-3-Clause"}
urls = {repository="https://github.com/ZeitOnline/pytest_kustomize"}
requires-python = ">=3.7"

dynamic = ["readme", "version"]

[project.optional-dependencies]
jq = [
    "jq>=1.8.0",
]

[dependency-groups]
dev = ["pytest", "jq"]

[project.entry-points.pytest11]
pytest_kustomize = "pytest_kustomize.plugin"


[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = ["/bin"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"
fragments = [{path="README.md"}, {text="\n\n"}, {path="CHANGES.md"}]


[tool.pytest.ini_options]
addopts = "--tb=native"


[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.isort]
from-first = true
lines-after-imports = 2
